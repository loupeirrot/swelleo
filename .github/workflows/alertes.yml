name: Alertes Telegram

# Lance le script d'alerte 2×/jour.
# Heures en UTC → 6h et 17h à Paris en hiver (UTC+1), 7h et 18h en été (UTC+2).
on:
  schedule:
    - cron: "0 5,16 * * *"
  workflow_dispatch:   # bouton manuel pour tester

permissions:
  contents: read

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests astral pytz

      - name: Envoyer les alertes Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python surf_alert.py

  # Empêche GitHub de désactiver le workflow après 60 jours sans commit.
  # Réactive le workflow via l'API, sans créer de commit.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: gautamkrishnar/keepalive-workflow@v2
