name: Déployer SurfAlert

# Quand le site se met à jour :
on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours ~7h (heure de Paris l'été, 6h l'hiver)
  push:
    branches: [main]      # à chaque modification du code
  workflow_dispatch:       # bouton "Run workflow" manuel

# Permissions nécessaires pour publier sur GitHub Pages
permissions:
  contents: write     # nécessaire au commit de maintien des crons (voir dernière étape)
  pages: write
  id-token: write

# Une seule publication à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests astral pytz

      - name: Générer les données de surf
        env:
          CANDHIS_KEY: ${{ secrets.CANDHIS_KEY }}
        run: python generate_data.py

      - name: Générer les pages SEO par spot
        run: python generate_pages.py

      - name: Préparer le site
        run: |
          mkdir -p _site/assets
          cp index.html data.json manifest.json sw.js sitemap.xml robots.txt CNAME _site/
          cp -r assets/* _site/assets/
          cp -r spots _site/spots
          cp -r regions _site/regions
          cp -r a-propos mentions-legales confidentialite _site/

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHub suspend les workflows planifiés après 60 jours sans activité sur le
      # dépôt : c'est ce qui a arrêté le site et les alertes le 07/11/2026, soit
      # 60 jours jour pour jour après le dernier commit. Un commit anodin tous les
      # 50 jours remet le compteur à zéro. [skip ci] évite de relancer ce workflow.
      - name: Maintenir les tâches planifiées actives
        if: github.event_name == 'schedule'
        run: |
          JOURS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Dernier commit il y a $JOURS jour(s)."
          if [ "$JOURS" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
            git add .github/keepalive
            git commit -m "Maintien des tâches planifiées [skip ci]"
            git push
            echo "Commit de maintien poussé."
          else
            echo "Rien à faire (seuil : 50 jours)."
          fi
